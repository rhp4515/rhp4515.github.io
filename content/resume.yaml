leadership:
  summary: "I've moved from being the person expected to know how the system works to creating the conditions for a team to make good decisions, deliver reliably, and grow without depending on me for every answer."
  entries:
    - {tag: "DIRECTION", variant: accent, title: "Direction beyond my own scope", body: "When several vertical teams were each building their own SSE streaming APIs, I made the case for a shared Pub/Sub platform capability, built consensus across engineering managers, and turned it into a committed workstream — contracts agreed before implementation so consumers could validate the model early."}
    - {tag: "OWNERSHIP", variant: accent, title: "Ownership placed, not accumulated", body: "Offered entitlement, metering and throttling as one bundle of platform responsibility, I separated the problem and placed each capability with the organisation best positioned to own it. Scope discipline is a leadership decision, not a modesty one."}
    - {tag: "RISK", variant: muted, title: "Risk named before it becomes failure", body: "Used real delivery data to show a migration pace incompatible with the firm's timeline, surfaced capacity and key-person risk the backlog didn't represent, and converted it into a tiered headcount proposal with explicit trade-offs. Inside the team, KTLO, resiliency, modernisation and forward capacity are budgeted separately so priority is visible."}
    - {tag: "PROD", variant: muted, title: "Ownership through production", body: "Incidents driven to resolution and follow-up, structural issues tracked as risks with remediation plans, stakeholders told early enough to act. Formalised on-call and triage that had depended on senior engineers' institutional knowledge; the team's standard is detecting problems before clients do."}
    - {tag: "PEOPLE", variant: accent, title: "Leadership capacity, built deliberately", body: "Three senior engineers now independently lead substantial areas, represent the team cross-functionally and handle escalations; two carry broader Tech Rep responsibility, and one — after clearer expectations and deliberately chosen opportunities — is now technical lead and my backup. Specific feedback, ownership matched to development needs, visible contributions, then genuinely stepping back."}
    - {tag: "SEAMS", variant: muted, title: "Work at the seams", body: "Identity, configuration, permissioning and runtime infrastructure get hard at the boundaries between teams — that's where I've spent my time, including consolidating team-level risk submissions into organisation-wide themes so leadership could prioritise systemic issues instead of reconciling lists."}

work:
  - {kicker: "platform", title: "Enterprise ingestion API platform", body: "One platform for client data entering the firm — FIX, REST and BLPAPI on shared infrastructure, with pub/sub subscription management carrying 1M+ transactions daily at 60× the legacy throughput."}
  - {kicker: "observability", title: "Ingestion visibility layer", body: "Dashboards and interfaces that show clients and internal teams exactly how their data is flowing — latency patterns, error hotspots, per-client activity — turning support escalations into self-diagnosis."}
  - {kicker: "framework", title: "DataMapper", body: "A configuration-based data dictionary for transformation and translation across sources — 600+ requests per second, scaling horizontally instead of by hand-written adapters."}
  - {kicker: "self-service", title: "Middleware portal", body: "Gave application teams direct control of their RabbitMQ and Kafka configuration, packaging and deployment — removing the middleware team as a bottleneck."}
  - {kicker: "automation", title: "SIMN workflow engine", body: "Authoring, validation, execution and audit for network device maintenance, turning tribal runbooks into repeatable workflows — 60%+ operator efficiency gain."}

