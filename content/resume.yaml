# Staging area — single source of truth for the resume.
#
# Edit this file, then run `python3 scripts/build.py` (or the `refresh-resume`
# skill) to regenerate ../index.html and ../data/resume.pdf. Do not hand-edit
# those two files — they're generated and get overwritten on every build.
#
# Dates are "YYYY-MM". Leave `end` unset (null) for the current role — the
# build script computes its duration, the timeline chart's bar positions, the
# axis year ticks, and the nav "uptime" badge from these dates and today's
# date, so they stay correct on every rebuild without manual math.

