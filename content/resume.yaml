leadership:
  summary: "I used to be the person expected to know how everything works. Now I try to set the team up to make good calls, ship reliably and grow without needing me for every answer."
  entries:
    - {tag: "DIRECTION", variant: accent, title: "Direction beyond my own scope", body: "Several teams were each building their own SSE streaming APIs. I made the case for one shared Pub/Sub capability, got the other engineering managers on board, and turned it into a committed workstream. We agreed contracts before implementation so consumers could test the model early."}
    - {tag: "OWNERSHIP", variant: accent, title: "Ownership placed, not accumulated", body: "When entitlement, metering and throttling landed on us as one bundle, I split the problem up and gave each piece to the organisation best placed to own it. Keeping scope tight is a leadership decision, not modesty."}
    - {tag: "RISK", variant: muted, title: "Risk named before it becomes failure", body: "I used real delivery data to show that our migration pace didn't fit the firm's timeline, flagged capacity and key-person risks the backlog didn't show, and turned that into a tiered headcount proposal with the trade-offs spelled out. Inside the team, KTLO, resiliency, modernisation and future capacity each get their own budget so priorities are visible."}
    - {tag: "PROD", variant: muted, title: "Ownership through production", body: "I follow incidents through to resolution and follow-up, track structural issues as risks with remediation plans, and tell stakeholders early enough that they can act. On-call and triage used to depend on what senior engineers happened to know; now they're formal. Our standard is to spot problems before clients do. A shared services and engineering channel ended a single-engineer bottleneck, release announcements help people connect issues to rollouts, and written stand-ups double as a journal for the quarter."}
    - {tag: "PEOPLE", variant: accent, title: "Leadership capacity, built deliberately", body: "Three senior engineers now lead big areas on their own, represent the team across functions and handle escalations. Two carry wider Tech Rep responsibility, and one, after clearer expectations and opportunities I picked on purpose, is now technical lead and my backup. What worked: specific feedback, ownership matched to what each person needed to grow, visible contributions, and then really stepping back. There's no promotion committee, so I make each case in the end-of-year evaluation with concrete examples of impact (about 5 engineers so far). On a two-level IC ladder, growth also comes through Tech Rep, guilds, conference talks, cross-team knowledge sharing and inner-sourcing."}
    - {tag: "SEAMS", variant: muted, title: "Work at the seams", body: "Identity, configuration, permissioning and runtime infrastructure get hard at the boundaries between teams, and that's where I've spent my time. That includes rolling team-level risk submissions up into org-wide themes so leadership could prioritise systemic issues instead of reconciling lists."}
    - {tag: "ORG DESIGN", variant: accent, title: "Splitting the team for the system's sake", body: "Inbound and outbound systems shared one team, and outbound was not getting the care it needed. I pushed to split the team so outbound had its own team and leader, and sent some of my own engineers over to seed it. The system mattered more than my scope."}
    - {tag: "HIRING", variant: muted, title: "Hiring by mutual match", body: "I've recruited about 8 engineers in the last three years (5 junior, 3 senior) and interview new and experienced hires regularly. Every one of the 5-6 team-matching sessions I took part in ended in a match, and those engineers stayed engaged for two years or more."}

work:
  - {kicker: "platform", title: "Enterprise ingestion API platform", body: "One platform for client data coming into the firm. FIX, REST and BLPAPI run on shared infrastructure, with pub/sub subscription management, carrying 1M+ transactions a day at 60× the legacy throughput."}
  - {kicker: "gateway", title: "Enterprise product gateway", body: "A separate system from the ingestion platform, taking about 10,000 compute-heavy requests a minute. Stabilized for memory use and availability, with asynchronous delivery for long-running requests. Token-based throttling and per-workflow, per-client rate limiting is in progress, as part of a long-term project to merge it with the ingestion platform into one."}
  - {kicker: "observability", title: "Ingestion visibility layer", body: "Dashboards that show clients and internal teams how their data is flowing: latency patterns, error hotspots, per-client activity. Support escalations turned into people diagnosing things themselves."}
  - {kicker: "framework", title: "DataMapper", body: "A configuration-based data dictionary for transforming and translating between sources. It handles 600+ requests per second and scales horizontally, so nobody writes adapters by hand."}
  - {kicker: "self-service", title: "Middleware portal", body: "Gave application teams direct control over their own RabbitMQ and Kafka configuration, packaging and deployment, so the middleware team stopped being a bottleneck."}
  - {kicker: "automation", title: "SIMN workflow engine", body: "Authoring, validation, execution and audit for network device maintenance. Tribal runbooks became repeatable workflows, with a 60%+ operator efficiency gain."}

