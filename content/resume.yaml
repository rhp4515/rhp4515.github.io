  summary: "Returns the trace first, then each span with its impact as measured outcomes."
  # Rendered both as the timeline chart (in document order) and, for kind:
  # role entries, as a detailed role card below it. kind: education entries
  # only appear in the chart and link to the #education section.
  spans:
    - id: role-em
      kind: role
      variant: strong
      short_title: "Engineering Manager"
      trace_org: "Bloomberg · Ingestion API Platform"
      title: "Engineering Manager — Enterprise Realtime Data Ingestion API Platform"
      org_line: "Bloomberg, New York"
      start: "2022-03"
      end: null
      facts:
        - ["scope", "Own two client-facing, real-time systems: the FIX, REST and BLPAPI ingestion platform that carries client trade and order workflows into Bloomberg, and the enterprise product gateway. End-to-end accountability for correctness, reliability and delivery."]
        - ["impact[0]", "Led a multi-year migration of live client traffic that turned the platform into a pure infrastructure layer, moving buyside and sellside ticketing logic to the domain teams that own it and the monolith to microservices. Clients saw no impact, and the freed capacity went to new services and the scale clients kept asking for. Ingestion went from 5 to 300 msg/s, at 1M+ transactions a day."]
        - ["impact[1]", "Took on a second team ahead of a capacity gap and merged it with mine into the enterprise product gateway team, now 12 engineers. Added backpressure and rate limiting to protect its real-time downstreams, and made the headcount case via API-first strategy."]
        - ["impact[2]", "Own the enterprise product gateway, a separate system taking about 10,000 compute-heavy requests a minute. Helped the team stabilize it for memory and high availability, with async delivery so long requests do not hold up callers. Now building token-based, per-workflow, per-client rate limiting so no one workflow starves the rest, ahead of merging it with the ingestion platform."]
        - ["impact[3]", "Grew three senior engineers into independent area leads, one now my technical lead and backup, so the team no longer depends on me for every call. Turned around a struggling engineer into a senior member the team leans on."]
        - ["impact[4]", "Bloomberg has no promotion committee, so promotions rest on the end-of-year evaluation. I build each engineer's case from specific examples and use cases of their impact, and made that case for about 5 engineers moving up."]
        - ["impact[5]", "Recruited about 8 engineers over the last 3 years (5 junior, 3 senior) and regularly interview new and experienced hires. New grads get real production work from day one, cutting ramp-up from 3 months to 1."]
        - ["impact[6]", "Pushed for one shared Pub/Sub platform when several teams were each building their own SSE APIs, with OpenAPI and Kafka contracts agreed before code so consumers could check them early."]
        - ["impact[7]", "Made \"catch it before the client does\" the team's standard, as senior management expects of client-facing systems: consistent logging, health dashboards from application and middleware metrics, and a support-first triage path with a chatbot. TDD/BDD is the default."]
        - ["impact[8]", "Asked every engineer to build AI into their daily work, with a concrete plan for how. It helped keep the migration on schedule, and AI-assisted issue detection now supports the team's goal of catching problems before clients do."]
        - ["impact[9]", "Stay hands-on where it pays off: prototyped the centralized command router myself (a kill switch and live-config mechanism that scaled where one socket per instance could not) then handed it off, and designed the move to microservices and taught the team it."]
        - ["impact[10]", "Directed the Solaris to Linux migration at DR-1 with 99.9%+ uptime and no disruption to trading days. Latency halved, releases went weekly, errors fell 30%."]

